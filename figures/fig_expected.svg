<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="348" viewBox="0 0 1240 348">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#574e43"/>
  </marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#14876b"/>
  </marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#a34517"/>
  </marker>
  <marker id="tee" viewBox="0 0 10 10" refX="5" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 5 0 L 5 10" stroke="#a34517" stroke-width="2.6" fill="none"/>
  </marker>
</defs>
<rect width="1240" height="348" fill="#ffffff"/><rect x="10" y="14" width="384" height="320" rx="3" ry="3" fill="#ffffff" fill-opacity="1.0" stroke="#ded4c2" stroke-width="1.4"/><text x="32" y="48" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#14876b" fill-opacity="1.0" font-weight="bold" text-anchor="start" letter-spacing="1.6">AIM 1</text><text x="32" y="74" font-family="Carlito, Calibri, sans-serif" font-size="15.5" fill="#171310" fill-opacity="1.0" font-weight="bold" text-anchor="start">Erythroid progenitors per gram</text><line x1="36" y1="172" x2="186" y2="172" stroke="#ded4c2" stroke-width="1.6"/><rect x="58" y="112" width="40" height="60" rx="4" fill="#8c8175"/><text x="78" y="190" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">control</text><rect x="126" y="146" width="40" height="26" rx="4" fill="#14876b"/><text x="146" y="190" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">flight /</text><text x="146" y="205" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">unloaded</text><text x="206" y="108" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#14876b" fill-opacity="1.0" font-weight="bold" text-anchor="start">Expected</text><text x="206" y="130" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">Fewer progenitors per gram</text><text x="206" y="147" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">in unloaded mice.</text><text x="32" y="244" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#171310" fill-opacity="1.0" font-weight="bold" text-anchor="start">If the opposite happens</text><text x="32" y="266" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">If progenitor number holds, the signal was tissue</text><text x="32" y="283" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">composition, and the model points at stroma alone.</text><rect x="417" y="14" width="384" height="320" rx="3" ry="3" fill="#ffffff" fill-opacity="1.0" stroke="#ded4c2" stroke-width="1.4"/><text x="439" y="48" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#a34517" fill-opacity="1.0" font-weight="bold" text-anchor="start" letter-spacing="1.6">AIM 2</text><text x="439" y="74" font-family="Carlito, Calibri, sans-serif" font-size="15.5" fill="#171310" fill-opacity="1.0" font-weight="bold" text-anchor="start">Gpx3+ cell identity and zoning</text><line x1="443" y1="172" x2="593" y2="172" stroke="#ded4c2" stroke-width="1.6"/><rect x="465" y="112" width="40" height="60" rx="4" fill="#8c8175"/><text x="485" y="190" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">control</text><rect x="533" y="146" width="40" height="26" rx="4" fill="#a34517"/><text x="553" y="190" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">flight /</text><text x="553" y="205" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">unloaded</text><text x="613" y="108" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#a34517" fill-opacity="1.0" font-weight="bold" text-anchor="start">Expected</text><text x="613" y="130" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">Gpx3 sits in an expanded</text><text x="613" y="147" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">stromal population. Fewer</text><text x="613" y="164" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">germinal centres.</text><text x="439" y="244" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#171310" fill-opacity="1.0" font-weight="bold" text-anchor="start">If the opposite happens</text><text x="439" y="266" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">If the zones are intact, the stromal change is</text><text x="439" y="283" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">composition, not disorganisation. Still new.</text><rect x="824" y="14" width="384" height="320" rx="3" ry="3" fill="#ffffff" fill-opacity="1.0" stroke="#ded4c2" stroke-width="1.4"/><text x="846" y="48" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#7c42ab" fill-opacity="1.0" font-weight="bold" text-anchor="start" letter-spacing="1.6">AIM 3</text><text x="846" y="74" font-family="Carlito, Calibri, sans-serif" font-size="15.5" fill="#171310" fill-opacity="1.0" font-weight="bold" text-anchor="start">Selenium rescue</text><line x1="850" y1="172" x2="1000" y2="172" stroke="#ded4c2" stroke-width="1.6"/><rect x="872" y="112" width="40" height="60" rx="4" fill="#8c8175"/><text x="892" y="190" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">control</text><rect x="940" y="146" width="40" height="26" rx="4" fill="#7c42ab"/><text x="960" y="190" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">flight /</text><text x="960" y="205" font-family="Carlito, Calibri, sans-serif" font-size="12" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="middle">unloaded</text><text x="1020" y="108" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#7c42ab" fill-opacity="1.0" font-weight="bold" text-anchor="start">Expected</text><text x="1020" y="130" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">Supplemented mice keep</text><text x="1020" y="147" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">more progenitors and a</text><text x="1020" y="164" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">normal ISG response.</text><text x="846" y="244" font-family="Carlito, Calibri, sans-serif" font-size="13.5" fill="#171310" fill-opacity="1.0" font-weight="bold" text-anchor="start">If the opposite happens</text><text x="846" y="266" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">If selenium does not rescue, Gpx3 marks damage, not</text><text x="846" y="283" font-family="Carlito, Calibri, sans-serif" font-size="13" fill="#574e43" fill-opacity="1.0" font-weight="normal" text-anchor="start">defence. That answers the target question.</text></svg>